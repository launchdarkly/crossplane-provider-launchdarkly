---
# Project requires spec.forProvider.environments (CRD / Terraform Min: 1). Nested blocks create
# production, staging, test. Do not duplicate those keys with standalone Environment CRs (provider
# warns against mixing nested envs with launchdarkly_environment for the same project).
apiVersion: project.launchdarkly.com/v1alpha1
kind: Project
metadata:
  name: crossplane-project
spec:
  forProvider:
    key: crossplane-project
    name: Crossplane-managed Project
    tags:
      - managed-by-crossplane
    environments:
      - key: production
        name: Production
        critical: true
        approvalSettings:
          - canApplyDeclinedChanges: false
            canReviewOwnRequest: false
            minNumApprovals: 3
            requiredApprovalTags:
              - approvals_required
        color: ABCDEF
        tags:
          - managed-by-crossplane
      - key: staging
        name: Staging
        color: "000000"
        tags:
          - managed-by-crossplane
      - key: test
        name: Test
        color: "FF5733"
        tags:
          - managed-by-crossplane
---
apiVersion: project.launchdarkly.com/v1alpha1
kind: Environment
metadata:
  name: development
spec:
  forProvider:
    key: development
    name: development
    projectKeyRef:
      name: crossplane-project
    color: FFFFFF
    tags:
      - managed-by-crossplane
