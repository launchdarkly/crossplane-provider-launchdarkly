# Team only. CustomRoles live in examples/custom_role/custom_role.yaml (applied in local-e2e Phase 1).
apiVersion: account.launchdarkly.com/v1alpha1
kind: Team
metadata:
  name: crossplane-created-product-manager-team
spec:
  forProvider:
    description: "Team for all Product Managers (managed with Crossplane)"
    name: crossplane-created-product-manager-team
    key: crossplane-created-product-manager-team
    memberIdsSelector:
      matchLabels:
        team: crossplane-created-product-manager-team

    maintainersRefs:
      - name: example-member-1

    customRoleKeysRefs:
      - name: crossplane-created-no-production-access
      - name: crossplane-created-allow-product-manager-tag

    # Role attributes are used to assign projects to the team.
    roleAttributes:
      - key: productManagerProjAttr
        values:
          - default
          - the-big-project
